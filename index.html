<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivikra Constructions - Beautiful Homes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }

        .slideshow-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .slide.active {
            opacity: 1;
        }

        .slide1 {
            background-image: url('https://images.unsplash.com/photo-1564013799919-ab600027ffc6?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80');
        }

        .slide2 {
            background-image: url('https://images.unsplash.com/photo-1570129477492-45c003edd2be?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80');
        }

        .slide3 {
            background-image: url('https://images.unsplash.com/photo-1582268611958-ebfd161ef9cf?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80');
        }

        .slide4 {
            background-image: url('https://images.unsplash.com/photo-1449824913935-59a10b8d2000?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80');
        }

        .slide5 {
            background-image: url('https://images.unsplash.com/photo-1518780664697-55e3ad937233?ixlib=rb-4.0.3&auto=format&fit=crop&w=1950&q=80');
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(0,0,0,0.4), rgba(59,130,246,0.3));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            z-index: 10;
        }

        .logo-container {
            position: absolute;
            top: 20px;
            right: 20px;
            animation: fadeInDown 2s ease-out;
            z-index: 20;
        }

        .logo {
            width: 100px;
            height: 67px;
        }

        .welcome-text {
            animation: fadeInUp 2s ease-out 0.5s both;
        }

        .welcome-text h1 {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #D4AF37, #3b82f6, #CFB53B, #1e40af, #B8860B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-text h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }

        .welcome-text p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }

        .enter-button {
            background: linear-gradient(45deg, #3b82f6, #1e40af);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59,130,246,0.4);
            animation: pulse 2s infinite;
        }

        .enter-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(59,130,246,0.6);
        }


        .skip-text {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .skip-text:hover {
            color: #3b82f6;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @media (max-width: 768px) {
            .welcome-text h1 {
                font-size: 2.5rem;
            }
            .welcome-text h2 {
                font-size: 1.5rem;
            }
            .welcome-text p {
                font-size: 1rem;
            }
            .logo {
                width: 70px;
                height: 47px;
            }
        }
    </style>
</head>
<body>
    <div class="slideshow-container">
        <div class="slide slide1 active"></div>
        <div class="slide slide2"></div>
        <div class="slide slide3"></div>
        <div class="slide slide4"></div>
        <div class="slide slide5"></div>

        <div class="overlay">
            <div class="logo-container">
                <svg class="logo" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
                    <!-- Blue Sudarshan Chakra with sun rays -->
                    <g transform="translate(25,35)">
                        <!-- Sun rays -->
                        <g stroke="#3b82f6" stroke-width="2" fill="#3b82f6">
                            <polygon points="0,-20 -3,-15 3,-15"/>
                            <polygon points="14,-14 12,-9 17,-12"/>
                            <polygon points="20,0 15,-3 15,3"/>
                            <polygon points="14,14 17,12 12,9"/>
                            <polygon points="0,20 3,15 -3,15"/>
                            <polygon points="-14,14 -12,9 -17,12"/>
                            <polygon points="-20,0 -15,3 -15,-3"/>
                            <polygon points="-14,-14 -17,-12 -12,-9"/>
                        </g>
                        <!-- Chakra wheel -->
                        <circle cx="0" cy="0" r="15" fill="none" stroke="#3b82f6" stroke-width="2"/>
                        <!-- Spokes -->
                        <g stroke="#3b82f6" stroke-width="1">
                            <line x1="0" y1="-12" x2="0" y2="12"/>
                            <line x1="-8.5" y1="-8.5" x2="8.5" y2="8.5"/>
                            <line x1="-12" y1="0" x2="12" y2="0"/>
                            <line x1="-8.5" y1="8.5" x2="8.5" y2="-8.5"/>
                        </g>
                        <!-- Center hub -->
                        <circle cx="0" cy="0" r="4" fill="#3b82f6"/>
                    </g>
                    
                    <!-- Modern buildings -->
                    <g transform="translate(55,25)">
                        <!-- Building 1 -->
                        <rect x="0" y="15" width="12" height="30" fill="#3b82f6" stroke="#2563eb" stroke-width="1"/>
                        <rect x="2" y="18" width="2" height="2" fill="#1e40af"/>
                        <rect x="5" y="18" width="2" height="2" fill="#1e40af"/>
                        <rect x="8" y="18" width="2" height="2" fill="#1e40af"/>
                        <rect x="2" y="25" width="2" height="2" fill="#1e40af"/>
                        <rect x="8" y="25" width="2" height="2" fill="#1e40af"/>
                        
                        <!-- Building 2 (taller) -->
                        <rect x="15" y="5" width="10" height="40" fill="#3b82f6" stroke="#2563eb" stroke-width="1"/>
                        <rect x="17" y="8" width="2" height="2" fill="#1e40af"/>
                        <rect x="20" y="8" width="2" height="2" fill="#1e40af"/>
                        <rect x="17" y="15" width="2" height="2" fill="#1e40af"/>
                        <rect x="20" y="15" width="2" height="2" fill="#1e40af"/>
                        <rect x="17" y="22" width="2" height="2" fill="#1e40af"/>
                        <rect x="20" y="22" width="2" height="2" fill="#1e40af"/>
                        
                        <!-- Building 3 -->
                        <rect x="28" y="20" width="8" height="25" fill="#3b82f6" stroke="#2563eb" stroke-width="1"/>
                        <rect x="30" y="23" width="1.5" height="1.5" fill="#1e40af"/>
                        <rect x="32.5" y="23" width="1.5" height="1.5" fill="#1e40af"/>
                        <rect x="30" y="30" width="1.5" height="1.5" fill="#1e40af"/>
                        <rect x="32.5" y="30" width="1.5" height="1.5" fill="#1e40af"/>
                    </g>
                    
                    <!-- Success figure with raised arms -->
                    <g transform="translate(95,25)">
                        <!-- Head -->
                        <circle cx="0" cy="0" r="4" fill="#3b82f6"/>
                        <!-- Body -->
                        <rect x="-3" y="4" width="6" height="8" fill="#3b82f6" rx="1"/>
                        <!-- Arms raised in victory -->
                        <line x1="-3" y1="6" x2="-7" y2="2" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
                        <line x1="3" y1="6" x2="7" y2="2" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
                        <!-- Legs -->
                        <line x1="-1" y1="12" x2="-1" y2="16" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
                        <line x1="1" y1="12" x2="1" y2="16" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
                    </g>
                    
                </svg>
            </div>

            <div class="welcome-text">
                <h1>Welcome to Trivikra Constructions</h1>
                <h2>Building Dreams Into Reality</h2>
                <p>Experience luxury living with our premium construction and development services</p>
                <button class="enter-button" onclick="enterSite()">Enter Our World</button>
            </div>

            <div class="skip-text" onclick="enterSite()">
                Click to skip slideshow
            </div>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;
        let slideInterval;
        const slideDuration = 4000; // 4 seconds per slide
        const totalDuration = slideDuration * totalSlides;

        function showSlide(index) {
            slides.forEach(slide => slide.classList.remove('active'));
            slides[index].classList.add('active');
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            showSlide(currentSlide);
        }


        function startSlideshow() {
            slideInterval = setInterval(nextSlide, slideDuration);
        }

        function enterSite() {
            clearInterval(slideInterval);
            
            // Fade out effect
            document.body.style.transition = 'opacity 1s ease-out';
            document.body.style.opacity = '0';
            
            setTimeout(() => {
                window.location.href = 'main.html';
            }, 1000);
        }

        // Start slideshow when page loads
        window.addEventListener('load', () => {
            setTimeout(startSlideshow, 1000);
        });

        // Auto-enter after 5 seconds
        setTimeout(() => {
            enterSite();
        }, 5000);
    </script>
</body>
</html>
